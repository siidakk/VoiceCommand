<!doctype html>
<!--
  Repo-root entry point.

  The application lives in web/. This stub exists so that a static host serving
  the repository root (GitHub Pages, Netlify drop, a plain file server) lands
  visitors on the app instead of a directory listing. The local Node server
  performs the same redirect in server/index.js.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Voice Shopping Assistant</title>
    <meta http-equiv="refresh" content="0; url=./web/" />
    <link rel="canonical" href="./web/" />
  </head>
  <body>
    <p>Redirecting to the <a href="./web/">Voice Shopping Assistant</a>…</p>
  </body>
</html>
