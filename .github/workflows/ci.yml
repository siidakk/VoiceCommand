# Runs the test suite on every push and pull request.
#
# There is no install step: the project has no dependencies, so `npm ci` would
# have nothing to do. The matrix pins the oldest supported runtime (Node 18,
# the first with a stable built-in test runner) alongside current LTS.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: ['18', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm test
